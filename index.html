<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Hours | Websites for builders and trades in Ireland and Malta</title>
    <meta name="description" content="Open Hours builds fast, enquiry-focused websites and Google profiles for builders and home-improvement trades in Ireland and Malta. Live in about 10 working days." />
    <meta property="og:title" content="Open Hours | Websites for builders and trades in Ireland and Malta" />
    <meta property="og:description" content="Open Hours builds fast, enquiry-focused websites and Google profiles for builders and home-improvement trades in Ireland and Malta. Live in about 10 working days." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#FFFFFF" />
    <script>
      // Safe fallback for third-party script rejections (e.g. adblockers blocking external tracking)
      window.addEventListener('unhandledrejection', function(event) {
        var str = String((event.reason && (event.reason.stack || event.reason.message)) || event.reason || '');
        if (str.includes('senja.io') || str.includes('platform.js')) {
          event.preventDefault();
        }
      });
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "[COMPANY_LEGAL_NAME]",
      "url": "https://openhours.studio",
      "logo": "https://openhours.studio/logo.svg",
      "description": "Fast, enquiry-focused websites and Google Business Profile setups for home-improvement and building trades in Ireland and Malta.",
      "founder": {
        "@type": "Person",
        "name": "[FOUNDER_NAME]"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[COMPANY_ADDRESS]"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "[CONTACT_EMAIL]",
        "contactType": "customer service"
      }
    }
    </script>
  </head>
  <body class="bg-white text-[#0F2A35] antialiased selection:bg-[#E3B896] selection:text-[#0F2A35] overflow-x-clip">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
